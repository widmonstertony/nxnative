name: NXGameLibrary
options:
  deploymentTarget:
    iOS: '16.1'
targets:
  NXGameLibrary:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [IndependentGameGlue.m, IndependentGameShellGlue.m]
      - path: LocalCovers
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonytan.nxgamelibrary
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGNING_ALLOWED: 'NO'
        CLANG_ENABLE_OBJC_ARC: 'YES'
        HEADER_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../../host'
        OTHER_CFLAGS: '$(inherited) -Werror=unguarded-availability'
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
